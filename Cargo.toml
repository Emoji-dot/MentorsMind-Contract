[workspace]
resolver = "2"
members = [
    "contracts/governance",
    "contracts/staking",
    "escrow",
    "multisig",
    "tools",
    "contracts/health_dashboard",
    "contracts/mnt-token",
    "contracts/shared",
    "contracts/verification",
    "contracts/session_registry",
    "contracts/referral",
    "contracts/referral_leaderboard",
    "contracts/reconciliation",
    "benchmarks",
    "contracts/treasury",
    "contracts/timelock",
    "contracts/payment_router",
    "contracts/dispute_evidence",
    "contracts/kyc_registry",
    "contracts/velocity_limits",
    "contracts/isa",
    "contracts/bridge_receiver",
    "contracts/subscription",
    "contracts/lending_pool",
    "tools/storage_scanner",
    "contracts/delegation",
    "contracts/escrow_factory",
    "contracts/upgrade_registry",
    "contracts/snapshot",
    "contracts/prediction_market",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
soroban-sdk = "25.3.0"
soroban-token-sdk = "25.3.0"

# Explicit dependency versions to avoid conflicts and edition2024 issues
ed25519-dalek = "2.2.0"  # Updated to match what soroban expects
rand_core = "0.6.4"
crypto-common = "0.1.6"  # Pin to version that doesn't require edition2024
base64ct = "1.8.2"       # Pin to version compatible with Rust 1.89
block-buffer = "0.12.0"  # Pin to older version 
cpufeatures = "0.2.14"   # Pin to older version
digest = "0.11.2"        # Pin to older version
hashbrown = "0.14.5"     # Pin to older version
indexmap = "2.12.0"      # Pin to older version
zeroize = "1.8.1"        # Pin to older version

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
